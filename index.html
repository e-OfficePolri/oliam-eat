<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oliam.eat - Transaksi</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2b2420; --muted:#7a6f66; --accent:#c8501e; --line:#eadfd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1816; --card:#262120; --ink:#f3ebe3; --muted:#a39689; --accent:#ee8a5a; --line:#3a322e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 16px 8px; max-width:900px; margin:auto; }
  h1 { margin:0; font-size:1.5rem; } h1 span { color:var(--accent); }
  main { max-width:900px; margin:auto; padding:8px 16px 40px; display:grid; gap:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat small { color:var(--muted); display:block; }
  .stat b { font-size:1.4rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; font-size:.92rem; }
  th { color:var(--muted); font-weight:500; }
  td.r, th.r { text-align:right; }
  button, textarea, select { font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.ghost { background:none; color:var(--muted); padding:2px 6px; }
  textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); color:var(--ink); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  pre { white-space:pre-wrap; margin:8px 0 0; color:var(--muted); font-family:inherit; }
  h2 { font-size:1rem; margin:0 0 10px; }
  .empty { color:var(--muted); padding:16px 0; text-align:center; }
</style>
</head>
<body>
<header><h1>oliam<span>.eat</span></h1></header>
<main>
  <div class="stats">
    <div class="card stat"><small>Omzet hari ini</small><b id="s-omzet">-</b></div>
    <div class="card stat"><small>Transaksi hari ini</small><b id="s-count">-</b></div>
    <div class="card stat"><small>Rata-rata / transaksi</small><b id="s-avg">-</b></div>
    <div class="card stat"><small>Omzet 7 hari</small><b id="s-week">-</b></div>
  </div>

  <div class="card">
    <h2>Tes catat transaksi (sama seperti kirim lewat WhatsApp)</h2>
    <textarea id="msg" rows="2" placeholder="Contoh: Budi: 2 nasi goreng, 1 es teh"></textarea>
    <div class="row" style="margin-top:8px"><button id="btn">Kirim</button></div>
    <pre id="reply"></pre>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">Riwayat transaksi</h2>
      <select id="filter">
        <option value="today">Hari ini</option>
        <option value="7">7 hari terakhir</option>
        <option value="all">Semua</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>#</th><th>Waktu</th><th>Pelanggan</th><th>Pesanan</th><th class="r">Total</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden>Belum ada transaksi.</div>
  </div>
</main>

<script>
const rp = n => 'Rp' + Number(n).toLocaleString('id-ID');
const wib = ts => new Date(ts + 7*3600*1000).toISOString();
const dayKey = ts => wib(ts).slice(0,10);
let all = [];

async function load() {
  const r = await fetch('/api/transactions');
  all = await r.json();
  render();
}

function render() {
  const now = Date.now();
  const today = dayKey(now);
  const f = document.getElementById('filter').value;
  const todays = all.filter(t => dayKey(t.ts) === today);
  const week = all.filter(t => now - t.ts < 7*86400000);
  const sum = l => l.reduce((s,t) => s + t.total, 0);

  document.getElementById('s-omzet').textContent = rp(sum(todays));
  document.getElementById('s-count').textContent = todays.length;
  document.getElementById('s-avg').textContent = todays.length ? rp(Math.round(sum(todays)/todays.length)) : '-';
  document.getElementById('s-week').textContent = rp(sum(week));

  const list = (f === 'today' ? todays : f === '7' ? week : all).slice().reverse();
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  document.getElementById('empty').hidden = list.length > 0;
  for (const t of list) {
    const tr = document.createElement('tr');
    const w = wib(t.ts);
    const cells = [
      t.id,
      w.slice(8,10) + '/' + w.slice(5,7) + ' ' + w.slice(11,16),
      t.customer || '-',
      t.items.map(i => i.qty + ' ' + i.name).join(', '),
    ];
    cells.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
    const tot = document.createElement('td'); tot.className = 'r'; tot.textContent = rp(t.total); tr.appendChild(tot);
    const act = document.createElement('td');
    const b = document.createElement('button'); b.className = 'ghost'; b.textContent = 'hapus';
    b.onclick = async () => {
      if (!confirm('Hapus transaksi #' + t.id + '?')) return;
      await fetch('/api/transactions/' + t.id, { method:'DELETE' });
      load();
    };
    act.appendChild(b); tr.appendChild(act);
    tbody.appendChild(tr);
  }
}

document.getElementById('filter').onchange = render;
document.getElementById('btn').onclick = async () => {
  const text = document.getElementById('msg').value;
  if (!text.trim()) return;
  const r = await fetch('/api/simulate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
  const j = await r.json();
  document.getElementById('reply').textContent = j.reply;
  document.getElementById('msg').value = '';
  load();
};

load();
setInterval(load, 10000); // segarkan otomatis tiap 10 detik
</script>
</body>
</html>
